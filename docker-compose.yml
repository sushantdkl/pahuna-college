services:
  backend:
    build:
      context: ./backend
    container_name: pahuna-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4040}:5050"
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - mern-net
    environment:
      NODE_ENV: production
      PORT: 5050
      MONGODB_URL: ${MONGODB_URL:-mongodb://host.docker.internal:27017/pahuna_college}
      JWT_SECRET: ${JWT_SECRET:-change-this-before-production}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@pahuna.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-123456}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3001}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-}
      PAHUNA_NOTIFICATION_EMAIL: ${PAHUNA_NOTIFICATION_EMAIL:-}

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4040}
        SERVER_API_URL: ${SERVER_API_URL:-http://backend:5050}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
        MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
        MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
    container_name: pahuna-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      - backend
    networks:
      - mern-net
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4040}
      SERVER_API_URL: ${SERVER_API_URL:-http://backend:5050}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}

volumes:
  backend-uploads:

networks:
  mern-net:
    driver: bridge
