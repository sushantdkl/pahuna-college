name: pahuna-backend

services:
  mongo:
    image: mongo:7
    container_name: pahuna-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - pahuna-net
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-pahuna_college}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-passpass}

  backend:
    build:
      context: .
    container_name: pahuna-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5050}:5050"
    depends_on:
      - mongo
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - pahuna-net
    environment:
      NODE_ENV: production
      PORT: 5050
      MONGODB_URL: mongodb://${MONGO_USER:-root}:${MONGO_PASS:-passpass}@mongo:27017/${MONGO_DB:-pahuna_college}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-change-this-before-production}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@pahuna.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-123456}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3001}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-}
      PAHUNA_NOTIFICATION_EMAIL: ${PAHUNA_NOTIFICATION_EMAIL:-}

volumes:
  mongo-data:
  backend-uploads:

networks:
  pahuna-net:
    name: pahuna-net
    driver: bridge
