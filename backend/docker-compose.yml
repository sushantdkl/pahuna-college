name: pahuna-backend

services:
  backend:
    build:
      context: .
    container_name: pahuna-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4040}:5050"
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - pahuna-net
    environment:
      NODE_ENV: production
      PORT: 5050
      MONGODB_URL: ${MONGODB_URL:-mongodb://host.docker.internal:27017/pahuna_college}
      JWT_SECRET: ${JWT_SECRET:-change-this-before-production}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@pahuna.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-123456}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3001}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-}
      PAHUNA_NOTIFICATION_EMAIL: ${PAHUNA_NOTIFICATION_EMAIL:-}

volumes:
  backend-uploads:

networks:
  pahuna-net:
    name: pahuna-net
    driver: bridge
